<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Klein Recycling · Client Portal</title>
<style>
  :root {
    --red: #C6211F;
    --red-dark: #9d1a18;
    --ink: #141414;
    --charcoal: #1c1c1c;
    --steel: #5c5854;
    --muted: #8a847c;
    --line: #e6e1d8;
    --paper: #f4f1eb;
    --card: #ffffff;
    --up: #1c7a4a;
    --up-bg: #e7f5ee;
    --down: #b42318;
    --down-bg: #fdecea;
    --flat: #6b6560;
    --blue: #4a77b3;
    --shadow: 0 10px 30px rgba(20,20,20,.06);
    --radius: 14px;
    --hover: #faf8f5;
    --input: #ffffff;
    --tag: #f1eee9;
    --amber-bg: #fff4e0;
    --amber: #8a5a00;
    --blue-bg: #e8f0fa;
    --banner-bg: #fff8e8;
    --banner-line: #f0e0b8;
    --banner-ink: #6d5420;
  }
  html[data-theme="night"] {
    --ink: #f3efe8;
    --steel: #c8c2b8;
    --muted: #9c968e;
    --line: #322f2b;
    --paper: #121110;
    --card: #1c1b19;
    --up: #3dcc7a;
    --up-bg: #163226;
    --down: #ff8d84;
    --down-bg: #3a1c1a;
    --flat: #b7b1a8;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --hover: #262421;
    --input: #141312;
    --tag: #2a2826;
    --amber-bg: #3a2e18;
    --amber: #f0c36a;
    --blue-bg: #1a2838;
    --blue: #8eb4e0;
    --banner-bg: #2a2418;
    --banner-line: #4a3e28;
    --banner-ink: #f0d9a4;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--red); }

  .gate {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    background: #0e0e0e;
  }
  .gate-brand {
    padding: 48px 56px;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      radial-gradient(900px 500px at 10% 110%, rgba(198,33,31,.35), transparent 60%),
      #0e0e0e;
  }
  .logo { width: min(420px, 100%); height: auto; display: block; }
  .gate-brand h1 { font-weight: 650; letter-spacing: -.03em; font-size: 40px; margin: 28px 0 8px; }
  .gate-brand p { color: #c8c2b8; max-width: 460px; line-height: 1.5; margin: 0; }
  .yard-meta { display: flex; gap: 28px; margin-top: 36px; color: #ddd; font-size: 14px; }
  .yard-meta b { display: block; color: #fff; font-size: 15px; margin-bottom: 4px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .pill.open { background: #1c7a4a; color: #fff; }
  .pill.closed { background: #3a3a3a; color: #eee; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  .gate-panel {
    background: var(--paper);
    padding: 48px 40px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .gate-panel h2 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.03em; }
  .sub { color: var(--steel); margin: 0 0 22px; line-height: 1.45; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .entry {
    display: flex; gap: 14px; align-items: center;
    width: 100%; text-align: left; padding: 16px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    margin-bottom: 10px;
  }
  .entry:hover { border-color: #c9c2b6; }
  .entry strong { display: block; }
  .entry span { color: var(--steel); font-size: 13px; }
  .mark {
    width: 42px; height: 42px; border-radius: 10px; flex: none;
    display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--ink);
  }
  .mark.red { background: var(--red); }
  .mark.steel { background: #3d3d3d; }
  .demo-note { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.45; }

  .shell { min-height: 100vh; display: grid; grid-template-columns: 248px 1fr; }
  .side {
    background: #111;
    color: #eee;
    padding: 18px 14px 24px;
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column;
  }
  .side img { width: 180px; margin: 6px 8px 18px; }
  .who { margin: 0 8px 16px; font-size: 13px; color: #c8c2b8; }
  .who b { color: #fff; display: block; font-size: 14px; }
  .navbtn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left; color: #ddd; background: transparent;
    border: 0; border-radius: 10px; padding: 10px 12px; margin-bottom: 2px;
  }
  .navbtn.active, .navbtn:hover { background: #2a2a2a; color: #fff; }
  .navbtn.active { box-shadow: inset 3px 0 0 var(--red); }
  .side .grow { flex: 1; }
  .ghost {
    background: transparent; color: #ddd; border: 1px solid #3a3a3a;
    border-radius: 10px; padding: 10px 12px; width: 100%;
  }
  .main { padding: 22px 28px 72px; max-width: 1180px; }
  .top {
    display: flex; justify-content: space-between; gap: 16px; align-items: flex-end;
    margin-bottom: 18px;
  }
  .top h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
  .top p { margin: 4px 0 0; color: var(--steel); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn {
    background: var(--red); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 14px; font-weight: 700;
  }
  .btn:hover { background: var(--red-dark); }
  .btn.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn.dark { background: var(--ink); }
  .btn.small { padding: 7px 10px; font-size: 13px; }
  .search, .field input, .field select, .field textarea {
    border: 1px solid var(--line); background: var(--input); border-radius: 10px; padding: 10px 12px;
  }
  .search { min-width: 220px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 7px 12px; font-size: 13px;
  }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat { padding: 14px 16px; }
  .stat .k { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .stat .v { font-size: 24px; font-weight: 750; letter-spacing: -.03em; margin-top: 4px; }
  .stat .s { color: var(--steel); font-size: 13px; margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 12px; }
  td { padding: 12px; border-top: 1px solid var(--line); vertical-align: middle; }
  tr.click:hover td { background: var(--hover); cursor: pointer; }
  .money { font-variant-numeric: tabular-nums; font-weight: 700; }
  .delta { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 8px; }
  .delta.up { background: var(--up-bg); color: var(--up); }
  .delta.down { background: var(--down-bg); color: var(--down); }
  .delta.flat { background: var(--tag); color: var(--flat); }
  .tag { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 8px; background: var(--tag); }
  .tag.green { background: var(--up-bg); color: var(--up); }
  .tag.amber { background: var(--amber-bg); color: var(--amber); }
  .tag.red { background: var(--down-bg); color: var(--down); }
  .tag.blue { background: var(--blue-bg); color: var(--blue); }

  .split { display: grid; grid-template-columns: 1.4fr .8fr; gap: 14px; }
  .pad { padding: 16px; }
  .pad h3 { margin: 0 0 10px; font-size: 16px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .item:last-child { border: 0; padding-bottom: 0; }
  .muted { color: var(--steel); font-size: 13px; }
  .banner {
    background: var(--banner-bg); border: 1px solid var(--banner-line); color: var(--banner-ink);
    border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .field textarea { min-height: 80px; resize: vertical; }
  .price-edit { width: 90px; }
  .spark { width: 100%; height: 84px; display: block; }
  .mobilebar { display: none; }
  .theme-btn { margin-bottom: 8px; }
  .theme-fab {
    display: none;
    position: fixed; right: 14px; bottom: 18px; z-index: 6;
    background: var(--ink); color: var(--paper); border: 0; border-radius: 999px;
    padding: 10px 14px; font-weight: 700; box-shadow: var(--shadow);
  }
  @media (max-width: 900px) {
    .theme-fab { display: inline-flex; bottom: 74px; }
  }
  .hide-sm { }

  @media (max-width: 900px) {
    .gate { grid-template-columns: 1fr; }
    .gate-brand { padding: 28px 22px 18px; }
    .gate-brand h1 { font-size: 28px; }
    .gate-panel { padding: 22px; }
    .yard-meta { flex-direction: column; gap: 12px; }
    .shell { grid-template-columns: 1fr; }
    .side { display: none; }
    .main { padding: 16px 14px 96px; }
    .stats, .split, .grid2 { grid-template-columns: 1fr; }
    .top { flex-direction: column; align-items: stretch; }
    .mobilebar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0;
      background: #111; padding: 8px; gap: 4px; z-index: 5;
    }
    .mobilebar button {
      flex: 1; background: transparent; color: #ddd; border: 0; border-radius: 10px;
      padding: 8px 4px; font-size: 11px;
    }
    .mobilebar button.on { background: #2a2a2a; color: #fff; }
    .hide-sm { display: none; }
  }
  @media print {
    .side, .mobilebar, .no-print { display: none !important; }
    .shell { display: block; }
    body { background: #fff; }
  }
</style>
</head>

    const rate = p.unit === "GT" ? p.acct / 2240 : p.acct;
    return sum + line.lbs * rate;
  }, 0);
}
function delta(p) {
  const d = +(p.acct - p.prev).toFixed(2);
  if (d > 0) return `<span class="delta up">▲ ${money(d, p.unit)}</span>`;
  if (d < 0) return `<span class="delta down">▼ ${money(Math.abs(d), p.unit)}</span>`;
  return `<span class="delta flat">— flat</span>`;
}
function yardOpen() {
  const now = new Date();
  const day = now.getDay();
  const mins = now.getHours() * 60 + now.getMinutes();
  if (day === 0) return false;
  if (day === 6) return mins >= 420 && mins < 900;
  return mins >= 420 && mins < 960;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c])); }

function spark() {
  const vals = COPPER_14;
  const min = Math.min(...vals) - 0.04, max = Math.max(...vals) + 0.04;
  const w = 520, h = 84, step = w / (vals.length - 1);
  const pts = vals.map((v,i) => `${i*step},${h - ((v-min)/(max-min))*h}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline fill="none" stroke="#C6211F" stroke-width="3" points="${pts}" />
  </svg>`;
}

document.body.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { view = go.dataset.go; openTicket = null; notice = ""; render(); return; }
  const enter = e.target.closest("[data-enter]");
  if (enter) {
    const id = enter.dataset.enter;
    if (id === "public") { session = { role:"public" }; view = "prices"; }
    else if (id === "desk") { session = { role:"desk" }; view = "desk"; }
    else { session = { role:"client", account: accountOf(id) }; view = "home"; }
    notice = ""; render(); return;
  }
  if (e.target.id === "theme-toggle" || e.target.id === "theme-toggle-mobile" || e.target.closest("#theme-toggle")) {
    theme = theme === "night" ? "day" : "night";
    localStorage.setItem("klein-theme", theme);
    applyTheme();
    render();
    return;
  }
  if (e.target.id === "signout" || e.target.id === "signout2") { session = null; view = "gate"; notice = ""; render(); return; }
  const cat = e.target.closest("[data-cat]");
  if (cat) { filter = cat.dataset.cat; render(); return; }
  const ticket = e.target.closest("[data-ticket]");
  if (ticket) { openTicket = ticket.dataset.ticket; render(); return; }
  if (e.target.id === "back-tickets") { openTicket = null; render(); return; }
  const calc = e.target.closest("[data-calc]");
  if (calc) {
    const p = priceOf(calc.dataset.calc);
    const lbs = prompt(`Pounds of ${p.name}?`, "500");
    if (!lbs) return;
    const rate = p.unit === "GT" ? p.acct / 2240 : p.acct;
    notice = `${Number(lbs).toLocaleString()} lb of ${p.name} at your account price is about ${usd(Number(lbs) * rate)}. Grade is confirmed on the scale.`;
    render(); return;
  }
  const doc = e.target.closest("[data-doc]");
  if (doc) { notice = `${doc.dataset.doc} would open from the document store. In this prototype it is listed only.`; render(); return; }
  if (e.target.id === "publish") {
    document.querySelectorAll("[data-price]").forEach(input => {
      const p = priceOf(input.dataset.price);
      const n = parseFloat(input.value);
      if (!Number.isFinite(n)) return;
      p.prev = p.acct;
      p[input.dataset.field] = n;
    });
    const now = new Date();
    db.publishedAt = now.toLocaleString("en-US", { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" });
    save();
    notice = "Board published. Signed-in accounts now see these prices.";
    view = "prices";
    render(); return;
  }
  if (e.target.id === "reset-prices") {
    db.prices = CATALOG.map(m => ({...m}));
    db.publishedAt = "2026-10-06 3:40 PM";
    save(); notice = "Sample prices restored."; render(); return;
  }
});

document.body.addEventListener("input", e => {
  if (e.target.id === "q") { query = e.target.value; render(); const box = document.getElementById("q"); if (box) { box.focus(); box.setSelectionRange(query.length, query.length); } }
});

document.body.addEventListener("submit", e => {
  if (e.target.id === "swap-form") {
    e.preventDefault();
    const data = new FormData(e.target);
    db.requests.push({ account: session.account.id, box: data.get("box"), when: data.get("when"), note: data.get("note") });
    save(); notice = "Request sent to the yard desk."; render();
  }
  if (e.target.id === "ticket-form") {
    e.preventDefault();
    const data = new FormData(e.target);
    const n = 10420 + db.tickets.length;
    db.tickets.unshift({ no:`KR-26-${n}`, account:data.get("account"), date:"2026-10-07", method:data.get("method"), status:"Pending ACH", lines:[{ mat:data.get("mat"), lbs:Number(data.get("lbs")) }] });
    save(); notice = `Ticket KR-26-${n} saved.`; openTicket = `KR-26-${n}`; view = "tickets"; render();
  }
});

render();
</script>
</body>
</html>
